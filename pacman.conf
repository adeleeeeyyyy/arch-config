[options]
Architecture = auto
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
Color
ParallelDownloads = 3
CheckSpace

#
# CachyOS repositories
#
[cachyos]
Server = https://mirror.cachyos.org/repo/cachyos/$arch

[cachyos-v3]
Server = https://mirror.cachyos.org/repo/cachyos-v3/$arch

#
# Arch Linux (CDN resmi, PALING STABIL)
#
[core]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

[multilib]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
